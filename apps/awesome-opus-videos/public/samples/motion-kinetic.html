<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>动能标题样片</title>
<style>
  html,body{margin:0;height:100%;background:#07070c;overflow:hidden;font-family:ui-sans-serif,system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}
  .tag{position:fixed;left:12px;bottom:12px;color:#9ae6b4;font-size:11px;letter-spacing:.08em;opacity:.7}
</style></head><body>
<canvas id="c"></canvas>
<div class="tag">本地样片 · 动能标题 · Canvas</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const DPR=Math.min(devicePixelRatio||1,2);
const lines=['OPUS','CODE','FILM'];
let particles=[];
function resize(){
  canvas.width=innerWidth*DPR; canvas.height=innerHeight*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();
function spawn(x,y){
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,hue:160+Math.random()*80});
  }
}
let t0=performance.now();
function frame(now){
  const t=(now-t0)/1000;
  const w=innerWidth,h=innerHeight;
  ctx.fillStyle='rgba(7,7,12,0.22)';
  ctx.fillRect(0,0,w,h);
  const idx=Math.floor(t*0.55)%lines.length;
  const text=lines[idx];
  const pulse=0.5+0.5*Math.sin(t*3);
  ctx.save();
  ctx.translate(w/2,h/2);
  ctx.scale(1+pulse*0.04,1+pulse*0.04);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`800 ${Math.min(w,h)*0.18}px ui-sans-serif,system-ui,sans-serif`;
  ctx.fillStyle=`hsla(${170+pulse*40},90%,70%,${0.85})`;
  ctx.shadowColor=`hsla(${170},100%,60%,0.6)`;
  ctx.shadowBlur=30;
  ctx.fillText(text,0,0);
  ctx.restore();
  if(Math.random()<0.08) spawn(w*0.2+Math.random()*w*0.6, h*0.25+Math.random()*h*0.5);
  particles=particles.filter(p=>p.life>0.02);
  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy; p.life*=0.96;
    ctx.fillStyle=`hsla(${p.hue},90%,65%,${p.life})`;
    ctx.fillRect(p.x,p.y,2,2);
  }
  // scanline
  ctx.fillStyle='rgba(255,255,255,0.03)';
  for(let y=0;y<h;y+=4) ctx.fillRect(0,y,w,1);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
