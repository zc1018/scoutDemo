<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>轨道场景样片</title>
<style>
  html,body{margin:0;height:100%;background:#050510;overflow:hidden;font-family:ui-sans-serif,system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}
  .tag{position:fixed;left:12px;bottom:12px;color:#90cdf4;font-size:11px;letter-spacing:.08em;opacity:.75}
</style></head><body>
<canvas id="c"></canvas>
<div class="tag">本地样片 · 伪 3D 轨道 · Canvas</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const DPR=Math.min(devicePixelRatio||1,2);
function resize(){canvas.width=innerWidth*DPR;canvas.height=innerHeight*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const bodies=[
  {r:18, orbit:0, speed:0.4, color:'#f6e05e', z:0},
  {r:8, orbit:70, speed:1.1, color:'#63b3ed', z:1},
  {r:5, orbit:110, speed:0.7, color:'#9f7aea', z:2},
  {r:12, orbit:160, speed:0.35, color:'#68d391', z:3},
  {r:4, orbit:200, speed:1.6, color:'#fc8181', z:4},
];
function frame(now){
  const t=now/1000, w=innerWidth, h=innerHeight;
  ctx.fillStyle='#050510'; ctx.fillRect(0,0,w,h);
  // stars
  for(let i=0;i<80;i++){
    const x=(Math.sin(i*12.1)+1)*0.5*w, y=(Math.cos(i*7.7)+1)*0.5*h;
    ctx.fillStyle=`rgba(255,255,255,${0.2+0.5*((Math.sin(t+i)+1)/2)})`;
    ctx.fillRect(x,y,1.5,1.5);
  }
  const cx=w/2, cy=h/2;
  const tilt=0.45;
  const sorted=[...bodies].map(b=>{
    const ang=t*b.speed + b.z;
    const x=Math.cos(ang)*b.orbit;
    const y=Math.sin(ang)*b.orbit*tilt;
    const depth=(Math.sin(ang)+1)/2; // 0 far 1 near
    return {...b,x:cx+x,y:cy+y,depth};
  }).sort((a,b)=>a.depth-b.depth);

  // orbits
  ctx.strokeStyle='rgba(144,205,244,0.15)'; ctx.lineWidth=1;
  for(const b of bodies){
    if(!b.orbit) continue;
    ctx.beginPath();
    ctx.ellipse(cx,cy,b.orbit,b.orbit*tilt,0,0,Math.PI*2); ctx.stroke();
  }
  for(const b of sorted){
    const s=0.7+b.depth*0.7;
    const grd=ctx.createRadialGradient(b.x-2,b.y-2,1,b.x,b.y,b.r*s);
    grd.addColorStop(0,'#fff'); grd.addColorStop(0.35,b.color); grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*s,0,Math.PI*2); ctx.fill();
    // shadow
    ctx.fillStyle=`rgba(0,0,0,${0.25+0.25*(1-b.depth)})`;
    ctx.beginPath(); ctx.ellipse(b.x,b.y+b.r*s*0.9,b.r*s*0.8,b.r*s*0.25,0,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#e2e8f0'; ctx.font='600 16px ui-sans-serif';
  ctx.fillText('轨道场景 · 本地伪 3D', 24, 36);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
